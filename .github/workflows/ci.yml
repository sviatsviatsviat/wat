name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/wat

      - name: Test .wat fixtures
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=(.wat/testdata/*/*.json)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "no fixtures under .wat/testdata" >&2
            exit 1
          fi
          for fixture in "${fixtures[@]}"; do
            case "$fixture" in
              *.expect.json) continue ;;
            esac
            agent="$(basename "$(dirname "$fixture")")"
            echo "::group::wat test --agent ${agent} --fixture ${fixture}"
            ./wat test --agent "$agent" --fixture "$fixture"
            echo "::endgroup::"
          done

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
