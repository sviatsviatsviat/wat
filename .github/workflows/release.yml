name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "refusing to release ${tag}: commit is not on origin/main" >&2
            git rev-parse --short "$tag" origin/main >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Extract release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          bash .github/scripts/changelog-section.sh "$tag" CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "empty changelog section for ${tag}" >&2
            exit 1
          fi

      - name: Build release binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
          )
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            archive_ext=".tar.gz"
            if [[ "$os" == windows ]]; then
              ext=".exe"
              archive_ext=".zip"
            fi
            stage="$(mktemp -d)"
            bin="${stage}/wat${ext}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/wat
            archive="dist/wat_${tag}_${os}_${arch}${archive_ext}"
            if [[ "$os" == windows ]]; then
              (cd "$stage" && zip -q "$OLDPWD/${archive}" "wat${ext}")
            else
              tar -C "$stage" -czf "$archive" "wat${ext}"
            fi
            rm -rf "$stage"
          done
          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > sha256sums.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease_args=()
          if [[ "$tag" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          assets=(dist/*.tar.gz dist/*.zip dist/sha256sums.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file dist/notes.md "${prerelease_args[@]}"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes-file dist/notes.md \
              "${prerelease_args[@]}"
          fi
