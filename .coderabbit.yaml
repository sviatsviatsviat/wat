# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  path_instructions:
    - path: "**/*.go"
      instructions: |
        For Go, require godoc on exported funcs, methods, types, consts, and
        vars (complete sentences starting with the identifier). Unexported
        helpers and _test.go callbacks do not need docstrings. Prefer fixing
        missing exported godoc over adding noise to private code.
  pre_merge_checks:
    docstrings:
      # CodeRabbit scores the PR diff and may count unexported symbols.
      # Repository CI ("Godoc coverage" in .github/workflows/ci.yml) is the
      # source of truth: exported identifiers ≥80% via
      # tools/check-godoc-coverage.
      mode: "warning"
      threshold: 80
code_generation:
  docstrings:
    path_instructions:
      - path: "**/*.go"
        instructions: |
          Use Go doc comments on exported identifiers only. Write a complete
          sentence that starts with the identifier name. Do not document
          unexported helpers or test callbacks unless behavior is non-obvious.
      - path: "**/*_test.go"
        instructions: |
          Skip docstring generation for ordinary test helpers and callbacks.
