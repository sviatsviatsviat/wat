# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  path_instructions:
    - path: "**/*.go"
      instructions: |
        For Go, require godoc on exported funcs, methods, types, consts, and
        vars (complete sentences starting with the identifier). Unexported
        helpers and _test.go callbacks do not need docstrings. Prefer fixing
        missing exported godoc over adding noise to private code. Do not treat
        private/unexported docstring coverage as a review gate.
  pre_merge_checks:
    docstrings:
      # CodeRabbit's docstring coverage metric scores the PR diff and may count
      # unexported symbols; it cannot be scoped to exported-only. Disable it.
      # Public API godoc is enforced by golangci-lint revive `exported`.
      mode: "off"
code_generation:
  docstrings:
    path_instructions:
      - path: "**/*.go"
        instructions: |
          Use Go doc comments on exported identifiers only. Write a complete
          sentence that starts with the identifier name. Do not document
          unexported helpers or test callbacks unless behavior is non-obvious.
      - path: "**/*_test.go"
        instructions: |
          Skip docstring generation for ordinary test helpers and callbacks.
